# The whole site on one small server: PostgreSQL, the app, Caddy for HTTPS,
# and a nightly database dump.
#   cp .env.example .env   (fill it in)   then   docker compose up -d --build
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: llmtactics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: llmtactics
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmtactics"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4400
      DATABASE_URL: postgres://llmtactics:${POSTGRES_PASSWORD}@db:5432/llmtactics
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      SITE_NAME: ${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TRUST_PROXY: 1

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *logging
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

  # One compressed dump a day in ./backups, named by day of the month, so the
  # last month is kept and each file is overwritten a month later. Copy them
  # off the server too: a dump on the same disk does not survive losing it.
  # Restore: gunzip -c backups/<dd>.sql.gz | docker compose exec -T db psql -U llmtactics llmtactics
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: llmtactics
      PGDATABASE: llmtactics
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          day=$$(date +%d)
          if pg_dump --clean --if-exists | gzip > /backups/part.sql.gz; then
            mv /backups/part.sql.gz /backups/$$day.sql.gz && echo "backup $$day done"
          else
            echo "backup $$day failed"
          fi
          sleep 86400
        done

volumes:
  db:
  caddy:
